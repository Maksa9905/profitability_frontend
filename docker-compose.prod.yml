services:
  profitability-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://profit.hakolr.dev}
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-https://api.profit.hakolr.dev}
        NUXT_PUBLIC_DEV_AUTH_USER_ID: ${NUXT_PUBLIC_DEV_AUTH_USER_ID:-00000000-0000-4000-8000-000000000001}
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - '127.0.0.1:${FRONTEND_BIND_PORT:-13030}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
