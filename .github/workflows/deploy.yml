name: Deploy frontend

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image owner (lowercase)
        id: meta
        run: |
          owner="${{ vars.IMAGE_REGISTRY || github.repository_owner }}"
          echo "owner=${owner,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://profit.hakolr.dev' }}
            NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL || 'https://api.profit.hakolr.dev' }}
            NUXT_PUBLIC_DEV_AUTH_USER_ID=${{ vars.NUXT_PUBLIC_DEV_AUTH_USER_ID || '00000000-0000-4000-8000-000000000001' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/profitability-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/profitability-frontend:latest
          push: true
          cache-from: type=gha,scope=profitability-frontend
          cache-to: type=gha,mode=max,scope=profitability-frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          IMAGE_REGISTRY: ${{ needs.build-and-push.outputs.owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_REGISTRY
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_FRONTEND_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_REGISTRY
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull profitability-frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps profitability-frontend
